server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Let Angular handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend container
    location /api/ {
        proxy_pass http://backend:8080;  # backend is your service name in docker-compose
    }
}
