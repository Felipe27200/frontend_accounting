<div class="flex justify-content-center">
    <!-- <p-toast />
    <p-confirmDialog /> -->

    <div class="flex mt-4">
        <p class="font-bold text-2xl"><span class="font-bold text-2xl pi pi-list mr-1"></span> User List</p>
    </div>
</div>

<div class="flex justify-content-center mt-4">
    <p-card>
        <p-table
          #dt2
          [value]="userList"
          [paginator]="true"
          [rows]="5"
          [rowsPerPageOptions]="[5, 10, 20]"
          styleClass="w-full"
          sortMode="multiple"
          [tableStyle]="{'width': '100%'}"
          [globalFilterFields]="['name']"
          [scrollable]="true"
          scrollHeight="700px"
        >
          <ng-template #caption>
            <div class="flex">
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input
                        pInputText
                        size="small"
                        #searchInput
                        type="text"
                        (input)="dt2.filterGlobal(searchInput.value, 'contains')"
                        placeholder="Search keyword"
                    />
                </p-iconfield>
            </div>
          </ng-template>
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="name">
                      <p-columnFilter field="name" display="menu"/>
                        Name <p-sortIcon field="name"/>
                    </th>
                    <th pSortableColumn="username">
                      <p-columnFilter field="username" display="menu"/>
                        Username <p-sortIcon field="username" />
                    </th>
                    <th pSortableColumn="role.name">
                        Role <p-sortIcon field="role.name" />
                    </th>
                    <th>
                        Actions
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-user>
                <tr>
                    <td>{{ user.name }}</td>
                    <td>{{ user.username }}</td>
                    <td>{{ user.role.name }}</td>
                    <td class="text-center">
                      <p-button 
                        icon="pi pi-file-edit" 
                        styleClass="h-7 !w-9 !mr-1 !mb-1"
                        size="small"
                        (onClick)="editUser(user.id)"
                      />
                      <p-button 
                          severity="danger" 
                          styleClass="h-7 !w-9 !mr-1 !mb-1"
                          icon="pi pi-trash"
                          size="small"
                      />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
</div>
