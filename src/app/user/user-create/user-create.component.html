<div class="flex justify-content-center flex-wrap">
    <p-card class="flex mt-6 pt-8 w-full sm:w-8 md:w-7 lg:w-5" styleClass="bg-gray-600">
        <ng-template pTemplate="header">
            <div class="text-center mt-8 text-3xl font-bold text-white">
                Create User
            </div>
        </ng-template>
    
        <ng-template pTemplate="content">
            <form [formGroup]="signUpForm">
                <div class="grid mt-5">
                    <div class="col-8 col-offset-2">
                        <label for="" class="text-white">Name:</label>
                        <input 
                          formControlName="Name"
                          type="text" 
                          pInputText
                          size="small" 
                          class="!text-sm !rounded-lg focus:ring-blue-500 focus:border-blue-500 block !w-full !p-2 !bg-gray-600 !border-gray-600 !placeholder-gray-400 !text-white !focus:ring-blue-500 !focus:border-blue-500 mt-2"
                        >
                    </div>
                    <div class="col-8 col-offset-2">
                        <label for="" class="text-white">Username:</label>
                        <input 
                          formControlName="username"
                          type="text" 
                          pInputText 
                          class="p-inputtext-sm surface-overlay p-2 appearance-none outline-none focus:border-primary w-full mt-2"
                        >
                    </div>
                
                    <div class="col-8 col-offset-2 mt-2">
                        <label for="password" class="text-white">Password:</label>
                        <input 
                          formControlName="password"
                          type="password" 
                          pInputText 
                          class="p-inputtext-sm surface-overlay p-2 appearance-none outline-none focus:border-primary w-full mt-2"
                        >
                        
                    </div>
                
                    <div class="col-8 col-offset-2 text-center mb-6">
                        <p-button 
                          type="submit" 
                          label="Login" 
                          styleClass="w-full" 
                        ></p-button>
                    </div>
                </div>
            </form>
        </ng-template>
    </p-card>
</div>
