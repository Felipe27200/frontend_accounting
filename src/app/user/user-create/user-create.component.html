<div class="flex justify-content-center flex-wrap">
    <p-card class="flex mt-6 pt-8 w-full sm:w-8 md:w-7 lg:w-5" styleClass="bg-gray-600">
        <ng-template pTemplate="header">
            <div class="text-center mt-8 text-3xl font-bold text-white">
                Create User
            </div>
        </ng-template>
    
        <ng-template pTemplate="content">
            <form [formGroup]="signUpForm" (ngSubmit)="onSumbit()">
                <div class="grid mt-5">
                    <div class="col-8 col-offset-2">
                        <label for="" class="text-white">Name:</label>
                        <input 
                          formControlName="newName"
                          type="text" 
                          pInputText
                          pSize="small" 
                          class="surface-overlay appearance-none outline-none !focus:border-primary w-full mt-2"
                        >
                    </div>
                    <div class="col-8 col-offset-2">
                        <label for="" class="text-white">Username:</label>
                        <input 
                          formControlName="newUsername"
                          type="text" 
                          pInputText
                          pSize="small"
                          class="surface-overlay p-2 appearance-none outline-none !focus:border-primary w-full mt-2"
                        >
                    </div>
                
                    <div class="col-8 col-offset-2 mt-2">
                        <label for="newPassword" class="text-white">Password:</label>
                        <input 
                          formControlName="newPassword"
                          type="password" 
                          pInputText 
                          pSize="small"
                          class="p-inputtext-sm surface-overlay p-2 appearance-none outline-none focus:border-primary w-full mt-2"
                        >
                    </div>

                    @if(errors.length > 0)
                    {
                        <div class="col-8 col-offset-2 mt-2 mb-3" >
                            @for (error of errors; track error) 
                            {
                                <p class="text-sm text-red-500 font-semibold">* {{ error }}</p>
                            }
                        </div>
                    }
                
                    <div class="col-8 col-offset-2 text-center mb-6">
                        <p-button 
                          type="submit" 
                          label="Create User" 
                          styleClass="w-full"
                          size="small" 
                        ></p-button>

                        <p-button 
                          label="Login" 
                          styleClass="w-full !mt-4"
                          size="small"
                          severity="secondary"
                          routerLink="/login" 
                        ></p-button>
                    </div>
                </div>
            </form>
        </ng-template>
    </p-card>
</div>
