<div class="flex justify-content-center">
    <p-toast />
    <p-confirmDialog />

    <div class="flex mt-4">
        <p class="font-bold text-2xl"><span class="font-bold text-2xl pi pi-list mr-1"></span> Financial Statement</p>
    </div>
</div>

<div class="flex justify-content-center mt-4">
    <p-card>
        <p-table
          #dt2
          [value]="listStatement"
          [paginator]="true"
          [rows]="5"
          [rowsPerPageOptions]="[5, 10, 20]"
          styleClass="w-full p-datatable-sm"
          sortMode="multiple"
          scrollHeight="700px"
          [globalFilterFields]="['name']"
        >
            <ng-template #caption>
                <div class="flex">
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input
                        pInputText
                        size="small"
                        #searchInput
                        type="text"
                        (input)="dt2.filterGlobal(searchInput.value, 'contains')"
                        placeholder="Search keyword"
                    />
                </p-iconfield>
            </div>
            </ng-template>

            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="name">
                        Name <p-sortIcon field="name" />
                    </th>
                    <th pSortableColumn="initDate">
                        Init Date <p-sortIcon field="initDate" />
                    </th>
                    <th pSortableColumn="endDate">
                        End Date <p-sortIcon field="endDate" />
                    </th>
                    <th>
                        Actions
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-statement>
                <tr>
                    <td>{{ statement.name }}</td>
                    <td>{{ statement.initDate }}</td>
                    <td [classList]="(statement.endDate != null ? '' : 'text-center')" >{{ (statement.endDate ?? '•••') }}</td>
                    <td>
                    <p-button 
                        size="small" 
                        icon="pi pi-file-edit" 
                        styleClass="h-7 !w-9 !mr-1 !mb-1"
                        (onClick)="editStatement(statement.id)" 
                    />
                    <p-button
                        size="small"
                        styleClass="h-7 !w-9 !mr-1 !mb-1"
                        severity="danger" 
                        icon="pi pi-trash" 
                        (onClick)="dialogDeleteStatement(statement, $event)" 
                    />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
</div>
