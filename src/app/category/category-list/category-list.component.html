<div class="flex justify-content-center">
    <p-toast />
    <p-confirmDialog />

    <div class="flex mt-4">
        <p class="font-bold text-2xl"><span class="font-bold text-2xl pi pi-list mr-1"></span> My Categories</p>
    </div>
</div>

<div class="flex justify-content-center mt-4">
    <p-card>
        <p-table
          #dt2
          [value]="categories"
          [paginator]="true"
          [rows]="5"
          [rowsPerPageOptions]="[5, 10, 20]"
          styleClass="w-full"
          sortMode="multiple"
          [tableStyle]="{'min-width': '50rem'}"
          [globalFilterFields]="['name']"
          [scrollable]="true"
          size="small"
        >
          <ng-template #caption>
            <div class="flex">
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input
                        pInputText
                        size="small"
                        #searchInput
                        type="text"
                        (input)="dt2.filterGlobal(searchInput.value, 'contains')"
                        placeholder="Search keyword"
                    />
                </p-iconfield>
            </div>
          </ng-template>
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="name">
                      <p-columnFilter field="name" display="menu"/>
                        Name <p-sortIcon field="name"/>
                    </th>
                    <th pSortableColumn="accountCatalogue.name">
                        Code <p-sortIcon field="accountCatalogue.name" />
                    </th>
                    <th>
                        Actions
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-category>
                <tr>
                    <td>{{ category.name }}</td>
                    <td>{{ category.accountCatalogue.name }}</td>
                    <td class="text-center">
                      <p-button 
                        icon="pi pi-file-edit" 
                        (onClick)="editCategory(category.id)"
                        styleClass="!mr-1"
                        size="small"
                      />
                      <p-button 
                          severity="danger" 
                          icon="pi pi-trash"
                          size="small"
                          (onClick)="dialogDeleteCategory(category.id, category.name, $event)" 
                      />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
</div>
