  <p-card>
    <ng-template #title>
        <p class="font-bold text-2xl text-center">
          <span class="font-bold text-2xl pi pi-file-edit mr-1"></span> 
          {{ titleCard }} Category
        </p>
    </ng-template>
    
    <form [formGroup]="categoryForm" (ngSubmit)="validateForm()">
        <div class="field">
            <label for="account-catalogue">Account Type:</label>
            <p-select 
              id="account-catalogue"
              formControlName="accountCatalogueId"
              [options]="accountsCatalogue"
              optionLabel="name"
              optionValue="id"
              placeholder="Select a type" 
              styleClass="text-base text-color surface-overlay border-1 border-solid surface-border rounded-sm appearance-none outline-none focus:border-primary w-full"/>
        </div>
        <div class="field">
            <label for="name">Name:</label>
            <input pInputText id="name" formControlName="name" type="text" class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border rounded-sm appearance-none outline-none focus:border-primary w-full">
        </div>
        <div class="field">
            <label for="parent-category">Parent Category:</label>
            <p-select 
              id="parent-category"
              formControlName="parentCategory"
              [showClear]="true"
              [options]="parentCategoryList"
              optionLabel="name"
              optionValue="id"
              placeholder="Select a type" 
              styleClass="!mb-5 text-base text-color surface-overlay border-1 border-solid surface-border rounded-sm appearance-none outline-none focus:border-primary w-full"/>
        </div>

        <p-button 
          type="submit" 
          [label]="titleCard + ' Category'"
          size="small"
          styleClass="w-full !mb-2 "
          [icon]=""
          [disabled]="!categoryForm.valid || !enableButton"
        ></p-button>
    </form>
  </p-card>

  <p-toast />
